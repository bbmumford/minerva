# Minerva — AI Engine Release
# Triggered on version tags (v*). Runs quality checks, builds WASM binary,
# builds CLI for all platforms, and creates a GitHub Release with all artifacts.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  GO_VERSION: '1.25.0'

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.2

      - name: go vet
        run: go vet ./...

      - name: go test -race
        run: go test -race -count=1 -timeout=5m ./...

      - name: Test coverage
        run: |
          go test -coverprofile=coverage.out -timeout=5m ./...
          go tool cover -func=coverage.out | tail -1

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  wasm:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build WASM
        run: GOOS=js GOARCH=wasm go build -o minerva.wasm ./wasm/cmd/

      - name: Copy JS assets
        run: |
          cp wasm/minerva.js .
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" .

      - uses: actions/upload-artifact@v4
        with:
          name: wasm-artifacts
          path: |
            minerva.wasm
            minerva.js
            wasm_exec.js

  build:
    needs: quality
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: ''
          - os: macos-latest
            goos: darwin
            goarch: amd64
            ext: ''
          - os: macos-latest
            goos: darwin
            goarch: arm64
            ext: ''
          - os: windows-latest
            goos: windows
            goarch: amd64
            ext: '.exe'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -o min-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} ./cmd/min/
      - uses: actions/upload-artifact@v4
        with:
          name: min-${{ matrix.goos }}-${{ matrix.goarch }}
          path: min-*

  release:
    needs: [wasm, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/minerva.wasm
            artifacts/minerva.js
            artifacts/wasm_exec.js
            artifacts/min-linux-amd64
            artifacts/min-darwin-amd64
            artifacts/min-darwin-arm64
            artifacts/min-windows-amd64.exe
