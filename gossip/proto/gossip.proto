syntax = "proto3";
package minerva.gossip.v1;
option go_package = "github.com/bbmumford/minerva/gossip/proto";

message CRDTDelta {
    string collection = 1;
    int32 crdtType = 2;
    string key = 3;
    bytes value = 4;
    uint64 hlc = 5;
    string nodeId = 6;
    bool tombstone = 7;
}

message GossipEnvelope {
    string appId = 1;
    repeated CRDTDelta deltas = 2;
    uint64 fingerprint = 3;
    string senderId = 4;
}
