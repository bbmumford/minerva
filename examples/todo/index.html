<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minerva Todo — Decentralised P2P Todo List</title>
<style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif; background: #f5f5f5; color: #222; max-width: 640px; margin: 0 auto; padding: 24px 16px; }
    h1 { font-size: 1.5rem; margin-bottom: 4px; }
    .status-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; font-size: 0.85rem; color: #666; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #ccc; display: inline-block; }
    .status-dot.connected { background: #4caf50; }
    .add-form { display: flex; gap: 8px; margin-bottom: 20px; }
    .add-form input[type="text"] { flex: 1; padding: 10px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; outline: none; }
    .add-form input[type="text"]:focus { border-color: #2196f3; }
    .add-form button { padding: 10px 20px; border: none; border-radius: 6px; background: #2196f3; color: #fff; font-size: 1rem; cursor: pointer; }
    .add-form button:hover { background: #1976d2; }
    .todo-list { list-style: none; }
    .todo-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: #fff; border-radius: 6px; margin-bottom: 6px; box-shadow: 0 1px 2px rgba(0,0,0,0.06); }
    .todo-item.done .todo-title { text-decoration: line-through; color: #999; }
    .todo-item input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }
    .todo-title { flex: 1; font-size: 0.95rem; word-break: break-word; }
    .todo-delete { border: none; background: transparent; color: #e53935; font-size: 1.1rem; cursor: pointer; padding: 4px 8px; border-radius: 4px; }
    .todo-delete:hover { background: #ffebee; }
    .empty-state { text-align: center; color: #999; padding: 40px 0; font-size: 0.95rem; }
    #peer-id { font-family: monospace; font-size: 0.75rem; color: #999; word-break: break-all; }
</style>
</head>
<body>

<h1>Minerva Todo</h1>
<div class="status-bar">
    <span class="status-dot" id="status-dot"></span>
    <span id="status-text">Initialising...</span>
    <span style="margin-left:auto;" id="peer-count">0 peers</span>
</div>
<div id="peer-id"></div>

<div class="add-form">
    <input type="text" id="todo-input" placeholder="What needs to be done?" disabled>
    <button id="add-btn" disabled>Add</button>
</div>

<ul class="todo-list" id="todo-list"></ul>
<div class="empty-state" id="empty-state">Loading...</div>

<script src="../../wasm/wasm_exec.js"></script>
<script src="../../wasm/minerva.js"></script>
<script>
(function () {
    'use strict';

    // --- DOM refs ---
    var todoInput = document.getElementById('todo-input');
    var addBtn = document.getElementById('add-btn');
    var todoList = document.getElementById('todo-list');
    var emptyState = document.getElementById('empty-state');
    var statusDot = document.getElementById('status-dot');
    var statusText = document.getElementById('status-text');
    var peerCountEl = document.getElementById('peer-count');
    var peerIdEl = document.getElementById('peer-id');

    var node = null;
    var todos = null; // CRDTCollection (LWW-Map)
    var localTodos = {}; // key -> {title, done, createdAt}

    // --- UUID generator ---
    function uuid() {
        if (typeof crypto !== 'undefined' && crypto.randomUUID) {
            return crypto.randomUUID();
        }
        return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
            var r = (Math.random() * 16) | 0;
            var v = c === 'x' ? r : (r & 0x3) | 0x8;
            return v.toString(16);
        });
    }

    // --- Render ---
    function render() {
        todoList.innerHTML = '';
        var keys = Object.keys(localTodos);
        // Sort by createdAt ascending.
        keys.sort(function (a, b) {
            return (localTodos[a].createdAt || 0) - (localTodos[b].createdAt || 0);
        });

        if (keys.length === 0) {
            emptyState.textContent = 'No todos yet. Add one above!';
            emptyState.style.display = '';
        } else {
            emptyState.style.display = 'none';
        }

        for (var i = 0; i < keys.length; i++) {
            var key = keys[i];
            var item = localTodos[key];
            if (!item || item._deleted) continue;

            var li = document.createElement('li');
            li.className = 'todo-item' + (item.done ? ' done' : '');
            li.dataset.key = key;

            var cb = document.createElement('input');
            cb.type = 'checkbox';
            cb.checked = !!item.done;
            cb.addEventListener('change', (function (k) {
                return function () { toggleTodo(k); };
            })(key));

            var title = document.createElement('span');
            title.className = 'todo-title';
            title.textContent = item.title || '';

            var del = document.createElement('button');
            del.className = 'todo-delete';
            del.textContent = '\u00d7';
            del.title = 'Delete';
            del.addEventListener('click', (function (k) {
                return function () { deleteTodo(k); };
            })(key));

            li.appendChild(cb);
            li.appendChild(title);
            li.appendChild(del);
            todoList.appendChild(li);
        }
    }

    // --- Todo actions ---
    function addTodo() {
        var text = todoInput.value.trim();
        if (!text) return;
        todoInput.value = '';

        var key = uuid();
        var item = { title: text, done: false, createdAt: Date.now() };
        localTodos[key] = item;
        render();

        if (todos) {
            todos.set(key, new TextEncoder().encode(JSON.stringify(item))).catch(function (err) {
                console.error('Failed to save todo:', err);
            });
        }
    }

    function toggleTodo(key) {
        var item = localTodos[key];
        if (!item) return;
        item.done = !item.done;
        render();

        if (todos) {
            todos.set(key, new TextEncoder().encode(JSON.stringify(item))).catch(function (err) {
                console.error('Failed to toggle todo:', err);
            });
        }
    }

    function deleteTodo(key) {
        delete localTodos[key];
        render();

        if (todos) {
            todos.delete(key).catch(function (err) {
                console.error('Failed to delete todo:', err);
            });
        }
    }

    // --- Load all todos from CRDT store ---
    function loadAll() {
        if (!todos) return Promise.resolve();
        return todos.all().then(function (entries) {
            for (var i = 0; i < entries.length; i++) {
                var entry = entries[i];
                try {
                    var text = new TextDecoder().decode(entry.value);
                    var parsed = JSON.parse(text);
                    localTodos[entry.key] = parsed;
                } catch (_) {
                    // skip malformed entries
                }
            }
            render();
        });
    }

    // --- Event handlers ---
    addBtn.addEventListener('click', addTodo);
    todoInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') addTodo();
    });

    // --- Peer count update ---
    function updatePeerCount() {
        if (!node) return;
        var peers = node.peers;
        var count = Array.isArray(peers) ? peers.length : 0;
        peerCountEl.textContent = count + ' peer' + (count !== 1 ? 's' : '');
    }

    // --- Initialise ---
    function init() {
        statusText.textContent = 'Loading WASM...';

        initMinerva('../../wasm/minerva.wasm').then(function () {
            node = new MinervaNode({
                appId: 'minerva-todo-example',
                relays: ['wss://relay.example.com/ws'],
                enablePEX: true,
            });

            return node.start();
        }).then(function () {
            statusDot.classList.add('connected');
            statusText.textContent = 'Connected';
            peerIdEl.textContent = 'Peer ID: ' + node.peerID;

            todoInput.disabled = false;
            addBtn.disabled = false;

            todos = node.store.lwwMap('todos');

            // Listen for remote changes.
            node.onStateChange('todos', function (key, value) {
                if (value == null || value.length === 0) {
                    delete localTodos[key];
                } else {
                    try {
                        var text = new TextDecoder().decode(value);
                        localTodos[key] = JSON.parse(text);
                    } catch (_) {}
                }
                render();
            });

            node.onPeerConnect(function () { updatePeerCount(); });
            node.onPeerDisconnect(function () { updatePeerCount(); });

            // Load existing todos.
            return loadAll();
        }).catch(function (err) {
            statusText.textContent = 'Error: ' + err.message;
            console.error('Minerva init failed:', err);
            emptyState.textContent = 'Failed to initialise. See console for details.';
        });
    }

    init();
})();
</script>
</body>
</html>
